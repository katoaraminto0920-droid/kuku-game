<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b20">
<title>まなびのアーケード</title>
<style>
:root{--ink:#f5f5ff;--muted:#b7c1e8;--cyan:#48e8ff;--pink:#fa62ec;--violet:#a58cff;--green:#77ff9d;--gold:#ffe36c}
*{box-sizing:border-box}
body{margin:0;background:#050716;color:var(--ink);font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
button{font:inherit;cursor:pointer}
.page{min-height:100vh;padding:22px 16px 30px;background:radial-gradient(ellipse at 50% 0%,#17245a 0,#090d27 45%,#040611 100%);position:relative;overflow:hidden}
.page:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 4px 5px);pointer-events:none}
.arcade-frame{max-width:1120px;margin:auto;padding:clamp(12px,2.2vw,25px);border:4px solid #8c9bc4;border-radius:30px;position:relative;background:linear-gradient(145deg,#0b102b,#07091b 65%,#100b2b);box-shadow:0 0 0 2px #252b52,0 0 18px #39dfff66,0 0 30px #f65be866,inset 0 0 25px #314b9a55}
.arcade-frame:before{content:"";position:absolute;inset:8px;border:3px solid transparent;border-radius:22px;background:linear-gradient(120deg,var(--cyan),#5f85ff,var(--pink)) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.9}
.header{text-align:center;position:relative;padding:15px 10px 22px}
.logo{margin:0;font-size:clamp(31px,6vw,68px);font-weight:1000;letter-spacing:.025em;line-height:1.05;color:#fff;text-shadow:0 0 5px #fff,0 0 13px var(--cyan),0 0 25px #367bff,0 0 38px var(--pink);-webkit-text-stroke:1px #a8eaff}
.subtitle{margin:10px 0 0;color:#c5d8ff;letter-spacing:.22em;font-size:clamp(10px,1.5vw,14px);text-shadow:0 0 10px #55caff}
.coinbar{position:absolute;right:12px;top:100%;transform:translateY(-4px);font-weight:900;color:var(--gold);font-size:clamp(13px,2vw,19px);text-shadow:0 0 10px #ffcf39}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.5vw,26px);padding:12px clamp(4px,4vw,42px) 28px;position:relative}
.game-card{border:3px solid var(--glow,var(--cyan));border-radius:18px;background:linear-gradient(145deg,#121936,#080b1d);padding:8px;color:white;text-align:center;box-shadow:0 0 8px var(--glow),inset 0 0 14px #5267a833;transition:transform .18s,box-shadow .18s;min-width:0}
.game-card:hover,.game-card:focus-visible{transform:translateY(-5px) scale(1.015);box-shadow:0 0 15px var(--glow),0 0 30px color-mix(in srgb,var(--glow),transparent 45%);outline:none}
.thumb{aspect-ratio:1.12/1;border-radius:11px;border:2px solid #65749e;background:radial-gradient(circle at 50% 40%,#26396b,#080b1d 70%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 18px #000b}
.thumb:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#fff1 5px);pointer-events:none}
.thumb svg{width:92%;height:92%;filter:drop-shadow(0 0 7px var(--glow))}
.kuku-thumb{background:#080b1d;padding:0}
.kuku-thumb img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;border-radius:8px}

.game-name{font-size:clamp(12px,2vw,19px);font-weight:1000;letter-spacing:.01em;margin:9px 0 2px;line-height:1.25;text-shadow:0 0 8px var(--glow)}
.game-type{font-size:clamp(9px,1.2vw,12px);color:#b9c7ee;margin:0 0 4px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 12px 7px;color:#aebbe0;font-size:11px;position:relative}
.footer strong{color:#dffaff}
.howto{border:1px solid #536b9e;border-radius:999px;background:#121b3e;color:#dce8ff;padding:8px 13px;font-weight:800}
.modal-bg{display:none;position:fixed;inset:0;background:#02040dd9;z-index:10;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{width:min(470px,100%);background:linear-gradient(145deg,#131b3b,#080b1e);border:2px solid var(--cyan);border-radius:22px;padding:22px;box-shadow:0 0 18px var(--cyan),0 0 35px #ad56ff88;position:relative;text-align:center}
.close{position:absolute;right:10px;top:10px;border:1px solid #5b6d9e;border-radius:50%;width:36px;height:36px;background:#1a2448;color:white;font-size:22px}
.modal-icon{font-size:54px;margin:5px 0 8px;filter:drop-shadow(0 0 10px var(--cyan))}
.modal h2{font-size:24px;margin:0 0 8px;text-shadow:0 0 12px var(--cyan)}
.modal p{color:#c2cbea;line-height:1.7;margin:0 0 14px}
.tags{margin-bottom:16px}.tag{display:inline-block;padding:5px 9px;border:1px solid #6176b4;border-radius:999px;color:#d7e7ff;font-size:11px;margin:3px}
.launch,.back{display:block;width:100%;border-radius:13px;padding:13px;border:0;font-weight:1000}
.launch{background:linear-gradient(90deg,#43dfff,#bd82ff,#ff70d9);color:#080b20;box-shadow:0 4px 0 #5358a2}
.back{margin-top:10px;background:#141e40;border:1px solid #53699d;color:#e4eaff}
.smallnote{font-size:11px!important;color:#8998c3!important;margin-top:12px!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:#151d3d;border:1px solid var(--cyan);color:white;padding:11px 17px;border-radius:999px;z-index:20;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.page{padding:12px 8px 20px}.arcade-frame{border-radius:21px;padding:10px 8px}.grid{gap:10px;padding:8px 3px 22px}.game-card{padding:5px;border-radius:13px;border-width:2px}.thumb{border-radius:8px}.game-name{font-size:11px;margin-top:7px}.game-type{font-size:9px}.header{padding:14px 5px 20px}.footer{font-size:9px;padding:0 4px 5px}.howto{font-size:10px;padding:7px 9px}}
@media(max-width:390px){.grid{gap:7px}.game-card{padding:4px}.game-name{font-size:10px}}
</style>
</head>
<body>
<div class="page">
 <main class="arcade-frame">
  <header class="header">
   <h1 class="logo">まなびのアーケード</h1>
   <p class="subtitle">LEARN · PLAY · LEVEL UP</p>
   <div class="coinbar">★ COINS: <span id="coins">0000</span></div>
  </header>
  <section class="grid" aria-label="学習ゲーム一覧">
   <button class="game-card" style="--glow:#66a5ff" data-app="kuku">
    <div class="thumb kuku-thumb"><img src="assets/kuku-title-screen.jpeg" alt="九九オブファイターズのスタート画面"></div>
    <div class="game-name">九九オブファイターズ</div><p class="game-type">九九バトルRPG</p>
   </button>
   <button class="game-card" style="--glow:#79ff9d" data-app="kanji">
    <div class="thumb"><svg viewBox="0 0 160 130" aria-hidden="true"><path d="M80 18l10 20 22 3-16 15 4 22-20-11-20 11 4-22-16-15 22-3z" fill="#8cffae" stroke="#e0ffe7" stroke-width="2"/><rect x="27" y="78" width="106" height="37" rx="8" fill="#315e64" stroke="#8cffae" stroke-width="3"/><text x="80" y="105" text-anchor="middle" fill="#f1fff4" font-size="25" font-weight="bold">漢字</text><path d="M20 35q10-18 20 0M120 32q10-18 20 0" stroke="#9cffb9" stroke-width="4" fill="none"/><circle cx="36" cy="58" r="5" fill="#ffdc76"/><circle cx="125" cy="62" r="5" fill="#ffdc76"/></svg></div>
    <div class="game-name">ガンジ＊テール</div><p class="game-type">漢字育成RPG</p>
   </button>
   <button class="game-card" style="--glow:#f36be8" data-app="typing">
    <div class="thumb"><svg viewBox="0 0 160 130" aria-hidden="true"><g fill="#222e5a" stroke="#ff8bf1" stroke-width="2"><rect x="14" y="72" width="132" height="39" rx="8"/><path d="M25 82h13v8H25zm19 0h13v8H44zm19 0h13v8H63zm19 0h13v8H82zm19 0h13v8h-13zm19 0h13v8h-13zM34 96h90v8H34z" fill="#70eaff" stroke="none"/></g><path d="M50 57q-10-28 15-34 25-6 30 19 3 20-19 24-19 4-26-9z" fill="#79ff9d" stroke="#dcffe7" stroke-width="3"/><circle cx="72" cy="48" r="4" fill="#10152d"/><path d="M80 57q10 7 18-1" stroke="#142040" stroke-width="3" fill="none"/><path d="M42 25l-9-13m72 17l11-13" stroke="#ffdd7a" stroke-width="4" stroke-linecap="round"/></svg></div>
    <div class="game-name">タイピングルズ</div><p class="game-type">タイピング育成</p>
   </button>
   <button class="game-card" style="--glow:#ffc66e" data-app="geometry">
    <div class="thumb"><svg viewBox="0 0 160 130" aria-hidden="true"><g stroke-width="3"><path d="M24 82l23-43 24 43z" fill="#ff7b8d" stroke="#ffd5d9"/><path d="M83 82V39h43z" fill="#74dcff" stroke="#d7f7ff"/><rect x="22" y="91" width="35" height="25" rx="2" fill="#9a8aff" stroke="#e3dcff"/><rect x="76" y="91" width="48" height="25" rx="2" fill="#ffe477" stroke="#fff5c2"/></g><path d="M112 17l5 10 11 5-11 5-5 10-5-10-11-5 11-5z" fill="#fff"/></svg></div>
    <div class="game-name">図形ファクトリー</div><p class="game-type">図形仕分けアクション</p>
   </button>
   <button class="game-card" style="--glow:#56e9ff" data-app="coming1">
    <div class="thumb"><svg viewBox="0 0 160 130" aria-hidden="true"><path d="M80 15l13 28 31 4-22 21 5 31-27-15-27 15 5-31-22-21 31-4z" fill="#55eaff" stroke="#d4fcff" stroke-width="3"/><text x="80" y="119" fill="#fff" text-anchor="middle" font-size="12">COMING SOON</text></svg></div>
    <div class="game-name">新しいゲーム</div><p class="game-type">準備中</p>
   </button>
   <button class="game-card" style="--glow:#bd8aff" data-app="coming2">
    <div class="thumb"><svg viewBox="0 0 160 130" aria-hidden="true"><circle cx="80" cy="58" r="34" fill="#5c4eaa" stroke="#d5c6ff" stroke-width="3"/><path d="M80 31v54M53 58h54" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="80" y="119" fill="#fff" text-anchor="middle" font-size="12">COMING SOON</text></svg></div>
    <div class="game-name">新しいゲーム</div><p class="game-type">準備中</p>
   </button>
  </section>
  <footer class="footer"><span>🎮 <strong>GAME SELECT</strong>　遊びたいゲームをタップ！</span><button class="howto" id="help">？ あそびかた</button></footer>
 </main>
</div>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <section class="modal"><button class="close" id="close" aria-label="閉じる">×</button><div class="modal-icon" id="modalIcon">🎮</div><h2 id="modalTitle">ゲーム名</h2><p id="modalDesc"></p><div class="tags" id="tags"></div><button class="launch" id="launch">このゲームであそぶ！</button><button class="back" id="back">一覧にもどる</button><p class="smallnote" id="note">ゲーム本体のURLは、公開後に設定できます。</p></section>
</div><div class="toast" id="toast"></div>
<script>
const apps={
 kuku:{title:"九九オブファイターズ",icon:"⚔️",desc:"九九の問題に挑戦して、キャラクターたちとバトル！九九の力で勝利をめざそう。",tags:["算数","九九","バトル"],url:"apps/kuku/index.html"},
 kanji:{title:"ガンジ＊テール",icon:"📜",desc:"二年生で学ぶ漢字を練習しながら、キャラクターを育てて冒険する漢字RPG！",tags:["国語","漢字","育成RPG"],url:""},
 typing:{title:"タイピングルズ",icon:"⌨️",desc:"文字を正しくタイピングしてモンスターを仲間にしよう！速さと正確さをきたえるゲーム。",tags:["タイピング","文字入力","育成"],url:""},
 geometry:{title:"図形ファクトリー",icon:"🔺",desc:"三角形・直角三角形・四角形・長方形・正方形を見分けて、正しい場所へ仕分けよう！",tags:["算数","図形","仕分け"],url:""},
 coming1:{title:"新しいゲーム",icon:"✨",desc:"これから追加する学習ゲームのためのスペースです。",tags:["準備中"],url:""},
 coming2:{title:"新しいゲーム",icon:"🌟",desc:"これから追加する学習ゲームのためのスペースです。",tags:["準備中"],url:""}
};
const bg=document.getElementById("modalBg"),toast=document.getElementById("toast");let selected=null,helpMode=false;
function open(id){selected=id;helpMode=false;const a=apps[id];document.getElementById("modalIcon").textContent=a.icon;document.getElementById("modalTitle").textContent=a.title;document.getElementById("modalDesc").textContent=a.desc;document.getElementById("tags").innerHTML=a.tags.map(x=>`<span class="tag">${x}</span>`).join("");document.getElementById("launch").style.display="block";document.getElementById("launch").textContent=a.url?"ゲームを起動する！":"このゲームであそぶ！";document.getElementById("note").textContent=a.url?"登録済みのゲームを開きます。":"ゲーム本体のURLはまだ登録されていません。公開後に接続できます。";bg.classList.add("open")}
function close(){bg.classList.remove("open");selected=null}
document.querySelectorAll(".game-card").forEach(b=>b.addEventListener("click",()=>open(b.dataset.app)));
document.getElementById("close").onclick=close;document.getElementById("back").onclick=close;bg.addEventListener("click",e=>{if(e.target===bg)close()});document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.getElementById("launch").onclick=()=>{if(!selected)return;const a=apps[selected];if(a.url)location.href=a.url;else{toast.textContent="ゲーム本体のURLはまだ設定されていません。";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}};
document.getElementById("help").onclick=()=>{selected=null;document.getElementById("modalIcon").textContent="🕹️";document.getElementById("modalTitle").textContent="あそびかた";document.getElementById("modalDesc").textContent="遊びたいゲームのアイコンをタップすると、ゲームの紹介が表示されます。ゲーム本体のURLを登録すると、そこから直接起動できるようになります。";document.getElementById("tags").innerHTML='<span class="tag">アイコンをタップ</span><span class="tag">ゲームを選ぶ</span>';document.getElementById("launch").style.display="none";document.getElementById("note").textContent="画面下の「一覧にもどる」で閉じられます。";bg.classList.add("open")};
bg.addEventListener("transitionend",()=>{if(!bg.classList.contains("open"))document.getElementById("launch").style.display="block"});
</script>
</body></html>
